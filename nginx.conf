worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       core/nginx-1.31.4/nginx-1.31.4/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $arg_app $use_case_backend {
        admissions_agent http://127.0.0.1:8767;
        zipnach_agent    http://127.0.0.1:8769;
        default          "";
    }

    map $arg_use_case $http_backend {
        zipnach    http://127.0.0.1:8769;
        admissions http://127.0.0.1:8767;
        default    http://127.0.0.1:8767;
    }

    # Our Voice API Gateway
    server {
        # The single port Asterisk will connect to
        listen 8080;
        server_name localhost;

        # Global WebSocket configuration
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 1. Route for Asterisk ARI Events
        location /ari/events {
            if ($use_case_backend = "") { return 404; }
            proxy_pass $use_case_backend;
        }

        # 2. Route for ARI Audio WebSocket
        location /ari/audio {
            if ($use_case_backend = "") { return 404; }
            proxy_pass $use_case_backend;
        }

        # Route for backward compatibility with Asterisk Stream
        location /asterisk-stream {
            if ($use_case_backend = "") { return 404; }
            proxy_pass $use_case_backend;
        }

        # 3. Standard HTTP API Routes (like /call or /health)
        location / {
            proxy_pass $http_backend;
        }
    }
}
