worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Our Voice API Gateway
    server {
        # The single port Asterisk will connect to
        listen 8088;
        server_name localhost;

        # Global WebSocket configuration
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 1. Route for Asterisk ARI Events
        location /ari/events {
            if ($arg_app = "admissions_agent") {
                proxy_pass http://127.0.0.1:8767;
            }
            if ($arg_app = "zipnach_agent") {
                proxy_pass http://127.0.0.1:8768;
            }
            
            # Default fallback if no valid app is provided
            return 404;
        }

        # 2. Route for ARI Audio WebSocket
        location /ari/audio {
            if ($arg_app = "admissions_agent") {
                proxy_pass http://127.0.0.1:8767;
            }
            if ($arg_app = "zipnach_agent") {
                proxy_pass http://127.0.0.1:8768;
            }
            
            return 404;
        }

        # 3. Standard HTTP API Routes (like /call or /health)
        location / {
            # Route based on use_case query parameter
            if ($arg_use_case = "zipnach") {
                proxy_pass http://127.0.0.1:8768;
            }
            if ($arg_use_case = "admissions") {
                proxy_pass http://127.0.0.1:8767;
            }
            
            # If no parameter is passed, default to Admissions
            proxy_pass http://127.0.0.1:8767; 
        }
    }
}
